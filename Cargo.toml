[package]
name = "printcher"
version = "0.1.0"
edition = "2021"
description = "Ferramenta de screenshot/anotação para Linux (X11 + Wayland), inspirada no ShareX"
repository = "https://github.com/davicolzer/printcher"

[[bin]]
name = "printcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["screenshot", "tokio"] }
chrono = "0.4.45"
dirs = "6.0.0"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
