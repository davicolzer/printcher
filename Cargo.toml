[package]
name = "printcher"
version = "0.1.0"
edition = "2021"
description = "Ferramenta de screenshot/anotação para Linux (X11 + Wayland), inspirada no ShareX"
repository = "https://github.com/davicolzer/printcher"

[[bin]]
name = "printcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", features = ["global_shortcuts", "screenshot", "tokio"] }
async-channel = "2.5.0"
cairo-rs = { version = "0.22.9", features = ["png"] }
chrono = "0.4.45"
dirs = "6.0.0"
futures-util = "0.3.34"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_22"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = "0.3.6"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
x11rb = "0.14.0"
zbus = { version = "5.19.0", features = ["tokio"] }
